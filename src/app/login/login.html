<form (submit)="onSubmit($event)" class="form-login">
  <h2>Logowanie</h2>
  <label>
    <input type="text" [formField]="loginForm.login" placeholder="e-mail" />
    @if (loginForm.login().touched() && loginForm.login().errors(); as errors) {
      <div class="error">
        @for (error of errors; track error.kind) {
          <p>{{ error.message }}</p>
        }
      </div>
    }
  </label>
  <label>
    <input type="password" [formField]="loginForm.password" placeholder="hasło" />
    @if (loginForm.password().touched() && loginForm.password().errors(); as errors) {
      <div class="error">
        @for (error of errors; track error.kind) {
          <p>{{ error.message }}</p>
        }
      </div>
    }
  </label>
  <a class="forgot-link" routerLink="/forgot-password">Zapomniałeś hasła?</a>
  <button class="btn" type="submit" [disabled]="loginForm().invalid()">Zaloguj się</button>
  @if (submitError()) {
    <p class="error">{{ submitError() }}</p>
  }
</form>
